# hyprlock.conf — GENERATED by `hwe theme apply` from the active theme's [sem].
# Do NOT edit; edit templates/hypr/hyprlock.conf.j2 or the theme's roles instead.

background {
    monitor = HDMI-A-1
    # $HOME, NOT ~ — hyprlang expands env vars but not a leading ~ (same gotcha
    # as hyprpaper), so `~/…` would fall back to the solid `color` below.
    path = /home/ponkipop/Downloads/Auy8Ya.jpg
    blur_passes = 0
    blur_size = 0
    color = rgb(151b26)
}

background {
    monitor = eDP-1
    path = /home/ponkipop/Downloads/848404.jpg
    blur_passes = 0
    blur_size = 0
    color = rgb(151b26)
}

general {
    hide_cursor = true
    grace = 0        # no passwordless window after lock (incl. manual Super+L)
}

# Password input field.
input-field {
    monitor = eDP-1
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.32
    dots_center = true
    rounding = 10
    outer_color = rgb(88c0d0)
    inner_color = rgb(1c2333)
    font_color = rgb(e5eaf0)
    placeholder_text = <span foreground="##b0bec5">Enter password…</span>
    fail_color = rgb(bf616a)
    fail_text = <span foreground="##bf616a">$FAIL ($ATTEMPTS)</span>
    position = 0, -40
    halign = center
    valign = center
}

# Keyboard-layout indicator (live via $LAYOUT). Sits just below the input field
# so you can confirm us/ru at a glance — Super+Space cycles it (bindl in
# keybindings.conf, the `l` flag lets the bind fire while locked).
label {
    monitor = eDP-1
    text = $LAYOUT
    font_size = 14
    font_family = GeistMono Nerd Font, JetBrains Mono, Symbols Nerd Font Mono
    color = rgb(b0bec5)
    position = 0, -104
    halign = center
    valign = center
}

# Big clock.
label {
    monitor = eDP-1
    text = cmd[update:1000] date +"%H:%M"
    font_size = 96
    font_family = GeistMono Nerd Font, JetBrains Mono, Symbols Nerd Font Mono
    color = rgb(e5eaf0)
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor = HDMI-A-1
    text = cmd[update:1000] date +"%H:%M"
    font_size = 96
    font_family = GeistMono Nerd Font, JetBrains Mono, Symbols Nerd Font Mono
    color = rgb(e5eaf0)
    position = 0, 160
    halign = center
    valign = center
}

# Date + user.
label {
    monitor = eDP-1
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 20
    font_family = GeistMono Nerd Font, JetBrains Mono, Symbols Nerd Font Mono
    color = rgb(b0bec5)
    position = 0, 60
    halign = center
    valign = center
}

label {
    monitor = HDMI-A-1
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 20
    font_family = GeistMono Nerd Font, JetBrains Mono, Symbols Nerd Font Mono
    colot = rgb(b0bec5)
    position = 0, 60
    halign = center
    valign = center
}