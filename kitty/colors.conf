# kitty/colors.conf — GENERATED by `hwe theme` from "Frost". DO NOT EDIT.
# kitty.conf does `include colors.conf`. Regenerate: hwe theme apply <name>

# Terminal translucency — a theme param (not a colour), but this is the only
# kitty file `hwe theme` generates, and its `include` lands after kitty.conf's
# own line, so setting it here lets the theme own the terminal's opacity. 
background_image /home/$USER/.config/required/kitty_bg_transparent.png
background_image_layout scaled
background_image_linear yes
background_opacity 0.4
# foreground #e5eaf0
# background #151b26
selection_foreground #151b26
selection_background #697a8c
cursor #88c0d0
cursor_text_color #151b26
url_color #5eb7ce

cursor_trail 1
cursor_trail_decay 0.1 0.4
progress_bar right
touch_scroll_multiplier 2.0

active_border_color   #88c0d0
inactive_border_color #243044
active_tab_foreground   #0d1117
active_tab_background    #88c0d0
inactive_tab_foreground #b0bec5
inactive_tab_background #0d1117

# ANSI black (0/8) and white (7/15) are scheme-aware: "black" must be the DARK
# end and "white" the LIGHT end whichever way the theme runs, or a light theme
# would paint ANSI-black text in a pale surface colour (invisible). The role
# extremes flip with the scheme (in a light theme fg_* is the dark ink and bg_*
# the light paper), so we swap which role feeds black vs white.
# normal

color0 #1c2333
color7 #b0bec5

color1 #bf616a
color2 #a3be8c
color3 #ebcb8b
color4 #81a1c1
color5 #b48ead
color6 #88c0d0
# bright

color8  #243044
color15 #e5eaf0

color9  #bf616a
color10 #a3be8c
color11 #ebcb8b
color12 #81a1c1
color13 #b48ead
color14 #88c0d0
